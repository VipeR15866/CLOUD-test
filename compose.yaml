Standardni PostgreSQL/NODE.JS

name: ma20240469-app

services:
  database:
    image: postgres:16-alpine
    container_name: ma20240469-db
    env_file:
      - env/backend.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d reservations"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - ma20240469-network

  backend:
    image: ma20240469-backend
    container_name: ma20240469-back
    env_file:
      - env/backend.env
    ports:
      - "5000:5000"
    volumes:
      - /app/node_modules
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ma20240469-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ma20240469-front
    env_file:
      - env/frontend.env
    ports:
      - "7000:3000"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - ma20240469-network

networks:
  ma20240469-network:
    name: ma20240469-network

volumes:
  postgres-data:
    name: postgres-data

