name: ma20240469-jul

services:
  backend:
    image: backend-image-z2
    container_name: ma20240469-server
    env_file:
      - env/backend.env
    ports:
      - "7000:5000"
    volumes:
      - /app/node_modules
      - ./backend:/app
    networks:
      - ma20240469-mreza
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ma20240469-app
    env_file:
      - env/frontend.env
    ports:
      - "3000:3000"  # Mapira lokalni port 3000 na port kontejnera
    volumes:
      - /app/node_modules
      - ./frontend:/app
    networks:
      - ma20240469-mreza
    depends_on:
      - backend

  database:
    image: postgres:16-alpine
    container_name: ma20240469-baza
    env_file:
      - env/database.env
    volumes:
      - ma20240469-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d games"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - ma20240469-mreza

volumes:
  ma20240469-postgres-data:

networks:
  ma20240469-mreza:
    driver: bridge
