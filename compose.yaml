echo "BACKEND CONTAINER" >> ma20240469-backend.txt
docker ps -f name=ma20240469-test >> ma20240469-backend.txt

echo "BACKEND LOGS" >> ma20240469-backend.txt
docker logs ma20240469-test >> ma20240469-backend.txt

