name: ma20240469-app

services:
  database:
    image: mysql:8.0
    container_name: ma20240469-db
    env_file:
      - env/backend.env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/my.cnf:/etc/mysql/conf.d/my-custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "student", "--password=student"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - ma20240469-network

  backend:
    image: ma20240469-backend
    container_name: ma20240469-back
    env_file:
      - env/backend.env
    ports:
      - "5000:5000"
    volumes:
      - /app/__pycache__
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ma20240469-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ma20240469-front
    env_file:
      - env/frontend.env
    ports:
      - "7000:3000"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - ma20240469-network

networks:
  ma20240469-network:
    name: ma20240469-network

volumes:
  mysql-data:
    name: mysql-data

