Standardni PostgreSQL/NODE.JS

services:
  backend:
    build: ./backend
    container_name: ma20240469-back
    ports:
      - "7000:5000"
    volumes:
      - /app/node_modules
      - ./backend:/app
    environment:
      - DB_HOST=ma20240469-db
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ma20240469-network

  frontend:
    build: ./frontend
    container_name: ma20240469-front
    ports:
      - "3000:3000"
    env_file:
      - ./env/frontend.env
    volumes:
      - /app/node_modules
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - ma20240469-network

  database:
    image: postgres:16-alpine
    container_name: ma20240469-db
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: studentpassword
      POSTGRES_DB: reservations
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d reservations"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - ma20240469-network

volumes:
  postgres-data:

networks:
  ma20240469-network:
    name: ma20240469-network

docker compose up -d

echo "IMAGES" >> ma20240469.txt
docker images >> ma20240469.txt

echo "CONTAINERS" >> ma20240469.txt
docker ps -a >> ma20240469.txt

echo "VOLUMES" >> ma20240469.txt
docker volume ls >> ma20240469.txt

echo "NETWORKS" >> ma20240469.txt
docker network ls >> ma20240469.txt

echo "COMPOSE" >> ma20240469.txt
docker compose ps >> ma20240469.txt

