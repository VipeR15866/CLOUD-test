services:
  backend:
    build: ./backend
    container_name: ma20240469-back
    ports:
      - "5000:5000"
    env_file:
      - ./env/backend.env
    volumes:
      - /app/__pycache__
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ma20240469-network

  frontend:
    build: ./frontend
    container_name: ma20240469-front
    ports:
      - "7000:3000"
    env_file:
      - ./env/frontend.env
    volumes:
      - /app/node_modules
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - ma20240469-network

  database:
    image: mysql:8.0
    container_name: ma20240469-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: reservations
      MYSQL_USER: student
      MYSQL_PASSWORD: studentpassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/my.cnf:/etc/mysql/conf.d/my.custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "student", "-pstudentpassword"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - ma20240469-network

volumes:
  mysql-data:

networks:
  ma20240469-network:
    name: ma20240469-network

docker compose up -d

echo "IMAGES" >> ma20240469.txt
docker images >> ma20240469.txt

echo "CONTAINERS" >> ma20240469.txt
docker ps -a >> ma20240469.txt

